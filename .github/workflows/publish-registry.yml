# Publishes server.json to the official MCP Registry
# (https://registry.modelcontextprotocol.io) under the namespace
# ai.everydaysecurity/*, proved by HTTP authentication.
#
# How the namespace is proved. The registry fetches
#   https://everydaysecurity.ai/.well-known/mcp-registry-auth
# and expects a plain-text proof record of the form
#   v=MCPv1; k=ed25519; p=<base64 public key>
# It sends no browser headers, follows no redirects, and must get a 200 within
# 10 seconds from Google Cloud addresses. `mcp-publisher login http` then signs
# with the matching private key. See the registry's
# docs/modelcontextprotocol-io/authentication.mdx ("HTTP Authentication").
#
# SECRET (not configured yet):
#   MCP_REGISTRY_PRIVATE_KEY  hex Ed25519 private key whose public half is in
#                             the proof file above. Store it as a secret on the
#                             `mcp-registry-publish` environment, restrict that
#                             environment to the default branch and v* tags,
#                             and add a required reviewer. A domain token can
#                             publish or overwrite any ai.everydaysecurity/*
#                             server, so treat it as a release credential.
#
# Runs only on a version tag or by hand.

name: Publish to MCP Registry

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: mcp-registry-publish
    timeout-minutes: 10
    env:
      # Pinned on purpose; bump deliberately. Latest release when this was written.
      MCP_PUBLISHER_VERSION: v1.8.6
    steps:
      - uses: actions/checkout@v5

      - name: Check the version in server.json matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          want="${GITHUB_REF_NAME#v}"
          have="$(python3 -c 'import json; print(json.load(open("server.json"))["version"])')"
          if [ "$want" != "$have" ]; then
            echo "server.json version is $have but the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Authenticate to the registry (HTTP domain proof)
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MCP_REGISTRY_PRIVATE_KEY}" ]; then
            echo "MCP_REGISTRY_PRIVATE_KEY is not set on the mcp-registry-publish environment" >&2
            exit 1
          fi
          ./mcp-publisher login http --domain everydaysecurity.ai --private-key "${MCP_REGISTRY_PRIVATE_KEY}"

      - name: Publish server.json
        run: ./mcp-publisher publish
